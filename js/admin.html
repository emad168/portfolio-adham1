<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Adham Sabry Portfolio</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./assets/images/logo.png">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Shared Themes and Admin CSS -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>

  <style>
/* Login card styles */
.admin-login-container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0f172a;
}
.login-card{
  max-width:420px;
  width:92%;
  padding:2.5rem;
  border-radius:16px;
  background:rgba(15,23,42,0.9);
  border:1px solid rgba(56,189,248,0.3);
  box-shadow:0 25px 50px -12px rgba(0,0,0,0.7);
  text-align:center;
}
.login-card .icon-badge{
  font-size:2rem;
  color:#38bde8;
  margin-bottom:1rem;
}
.login-card h3{
  margin:0.5rem 0 1.5rem;
  color:#f8fafc;
}
.login-card .form-group{
  display:flex;
  flex-direction:column;
  gap:0.5rem;
  margin-bottom:1.25rem;
}
.login-card input{
  background:#0b1120;
  border:1px solid #1e293b;
  padding:0.85rem 1rem;
  border-radius:10px;
  color:#f8fafc;
  width:100%;
}
.login-card button.submit,
.login-card button{
  width:100%;
  padding:0.75rem;
  border:none;
  border-radius:8px;
  background:linear-gradient(90deg,#38bde8,#2563eb);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  transition:opacity .2s;
}
.login-card button.submit:hover,
.login-card button:hover{
  opacity:0.9;
}
.login-card .back-link{
  display:block;
  margin-top:1.5rem;
  color:#38bde8;
  text-decoration:none;
  font-weight:500;
}
input:-webkit-autofill{
  -webkit-box-shadow:0 0 0 1000px #0b1120 inset !important;
  -webkit-text-fill-color:#f8fafc !important;
}
</style>
<div id="admin-login-container" class="admin-login-container">
  <div class="login-card">
    <div class="icon-badge"><i class="fas fa-shield-alt"></i></div>
    <h3>Admin Portal</h3>
    <form onsubmit="AdminController.handleLogin(event)">
      <div class="form-group">
        <label class="form-label">ADMIN EMAIL</label>
        <input type="email" id="login-email" placeholder="almasryadham601@gmail.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">PASSWORD</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit">Sign In</button>
    </form>
    <a href="./index.html" class="back-link">← Back to Website</a>
  </div>
</div>
<div class="admin-layout" style="display:none;">
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <a href="./index.html" class="sidebar-brand">
          <i class="fas fa-shield-alt" style="color: var(--cyan-primary);"></i>
          <span>Adham<span>.Admin</span></span>
        </a>
        <span class="admin-badge">v2.0-sec</span>
      </div>

      <nav class="sidebar-nav">
        <button class="sidebar-nav-item active" data-tab="overview">
          <i class="fas fa-tachometer-alt"></i>
          <span>Overview</span>
        </button>

        <button class="sidebar-nav-item" data-tab="projects">
          <i class="fas fa-project-diagram"></i>
          <span>Manage Projects</span>
        </button>

        <button class="sidebar-nav-item" data-tab="skills">
          <i class="fas fa-laptop-code"></i>
          <span>Manage Skills</span>
        </button>

        <button class="sidebar-nav-item" data-tab="certificates">
          <i class="fas fa-certificate"></i>
          <span>Manage Certificates</span>
        </button>

        <button class="sidebar-nav-item" data-tab="education">
          <i class="fas fa-graduation-cap"></i>
          <span>Manage Education</span>
        </button>

        <button class="sidebar-nav-item" data-tab="about">
          <i class="fas fa-user-edit"></i>
          <span>Edit About Me</span>
        </button>

        <button class="sidebar-nav-item" data-tab="contact">
          <i class="fas fa-address-book"></i>
          <span>Edit Contact Info</span>
        </button>

        <button class="sidebar-nav-item" data-tab="settings">
          <i class="fas fa-sliders-h"></i>
          <span>Website Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <a href="./index.html" class="btn btn-outline btn-sm" style="width: 100%; justify-content: center;">
          <i class="fas fa-arrow-left"></i> View Live Site
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="admin-main">
      <!-- Top Navigation Bar -->
      <header class="admin-topbar">
        <div class="topbar-title-wrap">
          <button class="topbar-mobile-toggle" id="admin-sidebar-toggle" aria-label="Toggle sidebar menu">
            <i class="fas fa-bars"></i>
          </button>
          <h1 class="admin-page-title" id="admin-page-title">System Overview</h1>
        </div>

        <div class="topbar-actions" style="display: flex; align-items: center; gap: 0.75rem;">
          <div id="admin-auth-status"></div>
          <a href="./index.html" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-sm">
            <i class="fas fa-external-link-alt"></i> Open Public Site
          </a>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <main class="admin-content-view" id="admin-view-container">
        <!-- Rendered dynamically by admin.js -->
      </main>
    </div>
  </div>

  <!-- Firebase SDK (Compat Version for Static HTML5) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- Load Data Files -->
  <script src="./js/data/profile.js"></script>
  <script src="./js/data/skills.js"></script>
  <script src="./js/data/projects.js"></script>
  <script src="./js/data/education.js"></script>
  <script src="./js/data/certifications.js"></script>
  <script src="./js/data/journey.js"></script>

  <!-- Security Sanitizer, Storage Engine & Firebase Service -->
  <script src="./js/sanitize.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/firebase-config.js"></script>
  <script src="./js/admin.js"></script>

</body>
</html>
