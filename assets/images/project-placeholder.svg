<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0b1528" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="350" fill="url(#bgGrad)"/>
  <rect width="600" height="350" fill="url(#grid)"/>
  
  <!-- Circuit lines -->
  <path d="M 50 175 L 180 175 L 230 110 L 370 110 L 420 175 L 550 175" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="180" cy="175" r="5" fill="#00f0ff"/>
  <circle cx="230" cy="110" r="5" fill="#0077fe"/>
  <circle cx="370" cy="110" r="5" fill="#0077fe"/>
  <circle cx="420" cy="175" r="5" fill="#00f0ff"/>

  <!-- Center Terminal Box -->
  <rect x="190" y="195" width="220" height="90" rx="8" fill="#060b19" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5"/>
  <text x="210" y="225" font-family="'JetBrains Mono', monospace" font-size="13" fill="#10b981">&gt; STATUS: OK</text>
  <text x="210" y="250" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00f0ff">LAB_ENVIRONMENT</text>
  <text x="210" y="270" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">SIMULATION_READY</text>
</svg>
