<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Adham Sabry Portfolio</title>
  <link rel="icon" type="image/png" href="./assets/images/logo.png">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">

  <style>
    .error-hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-card {
      background: var(--bg-glass-card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--cyan-border);
      border-radius: var(--radius-md);
      padding: 3.5rem 2.5rem;
      max-width: 540px;
      width: 100%;
      box-shadow: var(--glass-shadow);
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: 5rem;
      font-weight: 800;
      color: var(--cyan-primary);
      line-height: 1;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
    }
    .error-terminal-tag {
      display: inline-block;
      background: var(--bg-terminal);
      border: 1px solid var(--border-subtle);
      color: #ef4444;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 0.3rem 0.8rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1.5rem;
    }
    .error-title {
      font-size: 1.5rem;
      color: #fff;
      margin-bottom: 0.75rem;
    }
    .error-desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>

  <main class="error-hero">
    <div class="error-card">
      <div class="error-code">404</div>
      <div class="error-terminal-tag">
        <i class="fas fa-exclamation-triangle"></i> ERROR: PACKET_ROUTE_NOT_FOUND
      </div>
      <h1 class="error-title">Destination Unreachable</h1>
      <p class="error-desc">
        The requested URL or resource does not exist on this server. It might have been relocated or removed.
      </p>
      <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <a href="./index.html" class="btn btn-primary">
          <i class="fas fa-home"></i> Back to Homepage
        </a>
        <a href="./index.html#contact" class="btn btn-outline">
          <i class="fas fa-envelope"></i> Contact Support
        </a>
      </div>
    </div>
  </main>

</body>
</html>
